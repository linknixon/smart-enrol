<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S5 A-Level Online Application</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: #e9ecef;
    font-family: Arial, sans-serif;
    padding: 20px;
}
.card {
    background: #fff;
    max-width: 900px;
    margin: 20px auto;
    padding: 30px 40px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}
h3 {
    text-align: center;
    font-weight: bold;
    margin-bottom: 20px;
}
fieldset { display: none; border: none; }
fieldset.active { display: block; }
.progress-container {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
    position: relative;
}
.progress-step {
    width: 30px;
    height: 30px;
    background: #ced4da;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}
.progress-step.active {
    background: #0d6efd;
    color: #fff;
}
.progress-line {
    position: absolute;
    top: 50%;
    left: 15px;
    width: calc(100% - 30px);
    height: 4px;
    background: #ced4da;
    transform: translateY(-50%);
}
.progress-line-fill {
    height: 4px;
    background: #0d6efd;
    width: 0%;
    position: absolute;
    top: 50%;
    left: 15px;
    transform: translateY(-50%);
    border-radius: 2px;
    transition: width 0.3s ease;
}
</style>
</head>
<body>

<div class="card">
<h3>Senior Five (A-Level) Admission Application</h3>

<div class="progress-container">
    <div class="progress-step active">1</div>
    <div class="progress-step">2</div>
    <div class="progress-step">3</div>
    <div class="progress-line"></div>
    <div class="progress-line-fill"></div>
</div>

<form action="submit.php" method="POST" enctype="multipart/form-data" id="aLevelForm">

<!-- STEP 1: BIO DATA -->
<fieldset class="active">
<h5>Student Bio Data</h5>
<div class="row g-3">
    <div class="col-md-4"><input class="form-control" name="surname" placeholder="Surname" required></div>
    <div class="col-md-4"><input class="form-control" name="firstname" placeholder="First Name" required></div>
    <div class="col-md-4"><input class="form-control" name="othernames" placeholder="Other Names"></div>
</div>

<div class="row g-3 mt-2">
    <div class="col-md-6">
        <select class="form-select" name="sex" required>
            <option value="">Select Sex</option>
            <option>Male</option>
            <option>Female</option>
        </select>
    </div>
    <div class="col-md-6">
        <input type="date" class="form-control" name="dob" required>
    </div>
</div>

<div class="mt-3">
    <label class="form-label">Upload Passport Photo</label>
    <input type="file" class="form-control" name="passport" required>
</div>

<div class="text-end mt-4">
    <button type="button" class="btn btn-primary next-btn">Next</button>
</div>
</fieldset>


<!-- STEP 2: UCE INFORMATION -->
<fieldset>
<h5>UCE (O-Level) Information</h5>

<input class="form-control mb-2" name="former_school" placeholder="Former Secondary School" required>
<input class="form-control mb-2" name="uce_index" placeholder="UCE Index Number" required>

<label class="mt-2">Division Obtained</label>
<select class="form-select mb-3" name="division" required>
    <option value="">Select Division</option>
    <option>Division 1</option>
    <option>Division 2</option>
    <option>Division 3</option>
    <option>Division 4</option>
</select>

<label>Select A-Level Subject Combination</label>
<select class="form-select mb-3" name="combination" required>
    <option value="">Select Combination</option>

    <optgroup label="Science Combinations">
        <option>PCM (Physics, Chemistry, Mathematics)</option>
        <option>PCB (Physics, Chemistry, Biology)</option>
        <option>BCM (Biology, Chemistry, Mathematics)</option>
        <option>PEM (Physics, Economics, Mathematics)</option>
        <option>MEG (Mathematics, Economics, Geography)</option>
        <option>HEM (History, Economics, Mathematics)</option>
    </optgroup>

    <optgroup label="Arts Combinations">
        <option>HEG (History, Economics, Geography)</option>
        <option>HEL (History, Economics, Literature)</option>
        <option>HLD (History, Literature, Divinity)</option>
        <option>LEG (Literature, Economics, Geography)</option>
        <option>GEA (Geography, Entrepreneurship, Art)</option>
    </optgroup>

</select>

<label class="form-label">Attach UCE Result Slip</label>
<input type="file" class="form-control mb-3" name="result_slip" required>

<div class="d-flex justify-content-between mt-3">
    <button type="button" class="btn btn-secondary prev-btn">Previous</button>
    <button type="button" class="btn btn-primary next-btn">Next</button>
</div>
</fieldset>


<!-- STEP 3: PARENT -->
<fieldset>
<h5>Parent / Guardian Details</h5>
<input class="form-control mb-2" name="parent_name" placeholder="Parent Full Name" required>
<input class="form-control mb-2" name="parent_phone" placeholder="Phone Number" required>
<input class="form-control mb-2" name="parent_nin" placeholder="National ID Number" required>
<textarea class="form-control mb-2" name="parent_address" placeholder="Physical Address" required></textarea>
<input type="email" class="form-control mb-3" name="parent_email" placeholder="Email Address" required>

<div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" required>
    <label class="form-check-label">I confirm the information provided is correct</label>
</div>

<div class="d-flex justify-content-between mt-3">
    <button type="button" class="btn btn-secondary prev-btn">Previous</button>
    <button type="submit" class="btn btn-success">Submit Application</button>
</div>
</fieldset>

</form>
</div>


<script>
const fieldsets = document.querySelectorAll("fieldset");
const steps = document.querySelectorAll(".progress-step");
const lineFill = document.querySelector(".progress-line-fill");
let current = 0;

function showStep(index){
    fieldsets.forEach((fs,i)=> fs.classList.toggle("active", i===index));
    steps.forEach((s,i)=> s.classList.toggle("active", i<=index));
    lineFill.style.width = (index/(fieldsets.length-1))*100 + "%";
}

document.querySelectorAll(".next-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        if(current < fieldsets.length-1){ current++; showStep(current); }
    });
});

document.querySelectorAll(".prev-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        if(current > 0){ current--; showStep(current); }
    });
});
</script>

</body>
</html>
